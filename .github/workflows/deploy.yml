name: Deploy

on:
  push:
    branches: [main]
  # Triggered by the CMS header's "Publish Changes" button (event type
  # `sveltia-cms-publish`). Deploys everything committed-but-unpublished
  # without needing a new commit. No token/webhook required for GitHub Actions.
  repository_dispatch:
    types: [sveltia-cms-publish]

# Prevent overlapping production applies. A new push queues behind a running
# apply instead of cancelling it.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The `still` theme is a git submodule; Zola needs its files.
          submodules: recursive

      - name: Install pinned Zola
        run: |
          curl -sSL https://github.com/getzola/zola/releases/download/v0.23.6/zola-v0.23.6-x86_64-unknown-linux-gnu.tar.gz -o zola.tar.gz
          tar -xzf zola.tar.gz
          chmod +x zola
          ./zola --version

      - name: zola build
        run: ./zola --config zola.toml build

      - name: Stage Zola output for Terraform
        run: |
          mkdir -p infrastructure/generated
          cp -r public infrastructure/generated/public

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: terraform fmt
        working-directory: infrastructure
        run: terraform fmt -check -recursive

      # Runs remotely in HCP Terraform. The Cloudflare API token is provided
      # by the HCP workspace (CLOUDFLARE_API_TOKEN), not by GitHub secrets.
      - name: terraform init & apply
        working-directory: infrastructure
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve -no-color
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
