name: Deploy

on:
  pull_request:
  push:
    branches: [main]

# Prevent overlapping production applies. A new push queues behind a running
# apply instead of cancelling it.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build-and-plan:
    name: Build & plan
    runs-on: ubuntu-latest
    # Only for pull requests.
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The `still` theme is a git submodule; Zola needs its files.
          submodules: recursive

      - name: Install pinned Zola
        run: |
          curl -sSL https://github.com/getzola/zola/releases/download/v0.23.6/zola-v0.23.6-x86_64-unknown-linux-gnu.tar.gz -o zola.tar.gz
          tar -xzf zola.tar.gz
          chmod +x zola
          ./zola --version

      - name: zola check
        run: ./zola check --skip-external-links

      - name: zola build
        run: ./zola --config zola.toml build

      - name: Stage Zola output for Terraform
        run: |
          mkdir -p infrastructure/generated
          cp -r public infrastructure/generated/public

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: terraform fmt
        working-directory: infrastructure
        run: terraform fmt -check -recursive

      - name: terraform init & validate
        working-directory: infrastructure
        run: |
          # -backend=false: validates config without HCP credentials, so this
          # runs for fork PRs too (which have no access to TF_API_TOKEN).
          terraform init -backend=false
          terraform validate

      # A speculative remote plan needs HCP access. HCP/GitHub never expose
      # secrets to fork pull requests, so skip the plan for forks (the safe
      # checks above still run).
      - name: Remote speculative plan (HCP Terraform)
        if: github.event.pull_request.fork == false
        working-directory: infrastructure
        run: |
          terraform init -input=false
          terraform plan -input=false -no-color
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}

  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    # Only for pushes to the production branch (never from forks).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Intentionally no `needs`: deploy does its own build and must run on
    # main even though the PR-only plan job is skipped on pushes. A skipped
    # dependency would otherwise cascade and skip deploy too.

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pinned Zola
        run: |
          curl -sSL https://github.com/getzola/zola/releases/download/v0.23.6/zola-v0.23.6-x86_64-unknown-linux-gnu.tar.gz -o zola.tar.gz
          tar -xzf zola.tar.gz
          chmod +x zola
          ./zola --version

      - name: zola build
        run: ./zola --config zola.toml build

      - name: Stage Zola output for Terraform
        run: |
          mkdir -p infrastructure/generated
          cp -r public infrastructure/generated/public

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: terraform fmt
        working-directory: infrastructure
        run: terraform fmt -check -recursive

      # Runs remotely in HCP Terraform. The Cloudflare API token is provided
      # by the HCP workspace (CLOUDFLARE_API_TOKEN), not by GitHub secrets.
      - name: terraform init & apply
        working-directory: infrastructure
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve -no-color
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
