base_url = "https://adavidwilson.com"
title = "David's Blog"
description = "A techie's musings."
author = "David A. Wilson"
compile_sass = true
build_search_index = false
generate_feeds = true
feed_filenames = ["atom.xml"]
default_language = "en"
theme = "still"

[markdown]
bottom_footnotes = true

[markdown.highlighting]
light_theme = "rose-pine-dawn"
dark_theme  = "rose-pine"

[extra]
still_date_format = "%Y-%m-%d"
still_show_author = true
